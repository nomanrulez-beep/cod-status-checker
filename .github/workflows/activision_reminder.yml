name: Activision Status Email Reminder
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  reminder:
    runs-on: ubuntu-24.04
    steps:
      - name: Email account status check reminder
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl, sys
          from email.message import EmailMessage
          host=os.environ.get('SMTP_HOST','')
          port=587  # Brevo-recommended STARTTLS port
          user=os.environ.get('SMTP_USER','')
          password=os.environ.get('SMTP_PASSWORD','')
          recipient=os.environ.get('EMAIL_TO','')
          sender=os.environ.get('EMAIL_FROM','')
          if not all((host,user,password,recipient,sender)):
              raise SystemExit('Configure SMTP_HOST, SMTP_USER, SMTP_PASSWORD, EMAIL_FROM and EMAIL_TO in repository Actions secrets')
          msg=EmailMessage()
          msg['Subject']='Activision matchmaking status — check reminder'
          msg['From']=sender
          msg['To']=recipient
          msg.set_content('Reminder: Visit https://support.activision.com/ban-appeal and log in to check your current limited matchmaking status. This is NOT a verified status change alert.')
          try:
              if port==465:
                  with smtplib.SMTP_SSL(host,port,context=ssl.create_default_context(),timeout=25) as s:
                      s.login(user.strip(),password.strip())
                      s.send_message(msg)
              else:
                  with smtplib.SMTP(host,port,timeout=25) as s:
                      s.starttls(context=ssl.create_default_context())
                      s.login(user.strip(),password.strip())
                      s.send_message(msg)
          except smtplib.SMTPAuthenticationError:
              sys.exit('Brevo rejected SMTP login (535). Confirm SMTP activation, exact SMTP Login in SMTP_USER, and an SMTP key (not API key) in SMTP_PASSWORD. Secrets must be corrected in GitHub Settings.')
          except smtplib.SMTPException as e:
              sys.exit('SMTP error ('+type(e).__name__+'). Review Brevo account SMTP activation and sender verification.')
          print('Email reminder accepted by SMTP server.')
          PY